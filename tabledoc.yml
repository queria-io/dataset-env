$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: env
title: 環境省
description: |-
  環境省のウェブサイト（www.env.go.jp）が公開する資料のデータセットです。行政事業レビューのシートが関係する計画・通知等として挙げる環境省のサイトの PDF を、ページごとの本文で持ちます（plans）。毎月、シートの URL を取り直します。

  出典：行政事業レビュー見える化サイト（https://rssystem.go.jp）、環境省ウェブサイト（https://www.env.go.jp/）の各資料を加工して作成
image: cover.png
topics:
  - 環境省
  - 行政事業レビュー
  - 計画・通知等
language: ja
licenses:
  - JP-PDL-1.0
sources:
  - id: rssystem
    title: 行政事業レビュー見える化サイト（行政改革推進本部事務局）
    url: https://rssystem.go.jp
  - id: env
    title: 環境省ウェブサイト
    url: https://www.env.go.jp/
contributors:
  - id: env
    title: 環境省
    url: https://www.env.go.jp/
    roles:
      - rightsHolder
spatial_coverage:
  - JP
update_frequency: monthly
schemas:
  - name: plans
    title: 計画・通知等
