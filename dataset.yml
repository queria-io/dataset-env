# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
name: env
title: 環境省
description: |-
  環境省のウェブサイト（www.env.go.jp）が公開する資料のデータセットです。行政事業レビューのシートが関係する計画・通知等として挙げる環境省のサイトの PDF を、ページごとの本文で持ちます（plans）。毎月、シートの URL を取り直します。

  出典：行政事業レビュー見える化サイト（https://rssystem.go.jp）、環境省ウェブサイト（https://www.env.go.jp/）の各資料を加工して作成
keywords:
  - 環境省
  - 行政事業レビュー
  - 計画・通知等
homepage: https://github.com/queria-io/dataset-env
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 行政事業レビュー見える化サイト（行政改革推進本部事務局）
    path: https://rssystem.go.jp
  - title: 環境省ウェブサイト
    path: https://www.env.go.jp/

contributors:
  - title: 環境省
    path: https://www.env.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: plans
    title: 計画・通知等

annotations:
  queria:
    themes: [justice_safety_environment, government_finance]
    cover: 🌿
